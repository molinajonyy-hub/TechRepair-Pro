name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on new push to same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Quality gates (no app server needed) ─────────────────────────────────
  quality:
    name: TypeScript + Lint + Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22, como el resto de los jobs: PRE-BETA-3A-2 corre tests TypeScript
      # con `node --test` (tests/unit/*.test.ts), y eso necesita el type
      # stripping nativo (sin flag desde 22.18). En Node 20 mueren con
      # ERR_UNKNOWN_FILE_EXTENSION antes de ejecutar un solo test.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint (0 errors gate)
        run: npm run lint:errors

      - name: MOBILE-2A — unit/component + secret/write guards
        run: npm run test:mobile2a

      - name: Order detail — history render regression
        run: npm run test:components -- tests/components/orderDetailHistory.test.tsx tests/components/orderChecklistAusente.test.tsx

      - name: SEC-08E R1 — client contract and compatibility
        run: npm run test:components -- tests/components/sec08eClientContract.test.ts tests/components/sec08eUpdateUx.test.tsx tests/components/sec08eReload.test.ts tests/components/sec08ePartsUsedAccess.test.ts tests/components/mobileFoundations.test.tsx tests/components/portalUpdateDetector.test.tsx

      # PRE-BETA-2B · BLK-1: el login del portal traía la contraseña de una cuenta
      # demo real de producción. El valor nunca se imprime; ver el guard. El
      # self-test incluye el control negativo por CLI (es .mjs: corre en Node 20);
      # el test .ts de tests/unit queda para `npm run test:unit`.
      - name: Guard — no hardcoded credentials in the bundle (PRE-BETA-2B)
        run: npm run guard:no-hardcoded-credentials:self-test && npm run guard:no-hardcoded-credentials && npm run test:components -- tests/components/portalLoginNoDemo.test.tsx

      # PRE-BETA-2D: contrato de Auth que 2E despliega en producción. El guard
      # (.mjs, corre en Node 20) fija las plantillas token_hash versionadas, el
      # soporte canónico y el config LOCAL ([local_smtp], mínimo 8). Los tests de
      # componente fijan errores cerrados (nunca el texto de GoTrue ni de
      # `error_description`), la política 8/72 bytes, el perfil desactivado, el
      # portal (sin confirmar + reenvío, sin PII en logs) y los CTAs de la landing.
      # Los .ts de tests/unit quedan para `npm run test:unit`.
      - name: PRE-BETA-2D — auth UX hardening + token_hash templates
        run: npm run guard:auth-email-templates:self-test && npm run guard:auth-email-templates && npm run test:components -- tests/components/authUxHardening.test.tsx tests/components/inactiveProfile.test.tsx tests/components/portalAuthUx.test.tsx tests/components/portalAuthUxScreens.test.tsx tests/components/landingSignupIntent.test.tsx tests/components/supportContact.test.tsx tests/components/signupIntent.test.ts tests/components/emailVerification.test.tsx tests/components/passwordRecovery.test.tsx tests/components/wholesaleEmailConfirmation.test.tsx

      # PRE-BETA-2F: entrega por correo de invitaciones. El guard (.mjs) fija la
      # estructura: clave nunca literal ni del lado del navegador, enlace canónico
      # de una sola fuente, destinatario/token desde la fila de la DB, sin
      # service_role, JWT antes del body. Los tests de componente cubren link,
      # plantilla, servicio y UsersManagement. El handler corre en `test:deno`.
      - name: PRE-BETA-2F — invitation email delivery
        run: npm run test:prebeta2f

      # PRE-BETA-3A-0: guardrails de beta. Fija que Mi Guita no se promete, que
      # los CTAs del embudo usan --text-on-accent (inmunes al remapeo de texto
      # blanco inline en light mode) y que banner de suscripción, rutas
      # /subscription/*, header del Dashboard, Ctrl+K y Primeros pasos se
      # filtran por capacidad efectiva; el rebote de permiso se explica.
      # Suma a CI los tests de RBAC visual, navegación mobile y primeros pasos.
      - name: PRE-BETA-3A-0 — beta UX and capability guardrails
        run: npm run test:prebeta3a0

      # PRE-BETA-3A-1a: onboarding de configuración (4 pasos + final, sin trial ni
      # checklist propio) y shell compartido de /verificar-email, /no-business y
      # /onboarding. Suma el guard del perfil canónico del negocio y las suites
      # de routing/onboarding (P0-P4/P5) y de provisioning, que no corrían en CI.
      - name: PRE-BETA-3A-1a — onboarding + post-login shell
        run: npm run test:prebeta3a1a

      # PRE-BETA-3A-2: alta de cliente canónica + gate Mayorista (feature
      # `mayorista` Y permiso `wholesale`, sin roles). Fija que nada se ve rojo
      # antes de interactuar, que el CTA no se deshabilita por validación, que
      # la alta rápida no se gatea por `customers` y que un mayorista existente
      # sin gate se conserva. Suma a CI las suites de Customer Core, que no
      # corrían acá. Es gate de UX: el servidor todavía no impide
      # `customer_type = 'mayorista'` (ver el PR).
      - name: PRE-BETA-3A-2 — customer creation + wholesale gate
        run: npm run test:prebeta3a2

      # P0-P1: invariantes de provisioning. Es estático —lee migraciones y
      # `src/`— así que no necesita DB ni credenciales y puede correr acá, en
      # PRs y en forks. El self-test va primero: un guard que no puede fallar no
      # prueba nada, y este ya reemplazó a la barrera que vivía en un trigger.
      - name: Guard — autoridad de provisioning
        run: npm run guard:provisioning-authority:self-test && npm run guard:provisioning-authority

      - name: Guard — Lote 3 action/write authority
        run: npm run guard:lote3-authority:self-test && npm run guard:lote3-authority

      # ARCA SELF-SERVICE PHASE 0: no browser path may upload a private key, replace the
      # certificate without validation, write estado_conexion or write arca_config directly;
      # ARCA management stays owner/admin + settings_sensitive with the tenant resolved by
      # identity. Static (migrations + src + Edge), so it runs on PRs and forks. Every guard
      # runs its self-test first: each one plants the violation it must detect.
      - name: Guard — ARCA Phase 0 legacy writes + canonical management authority
        run: npm run test:arca-phase0

      # ARCA SELF-SERVICE PHASE 1: the ARCA status card reads ONE server-side read model.
      # The RPC stays authenticated-only with the tenant resolved by identity, the private
      # derivation never reads WSAA/Vault/CSR material, output keys stay inside the contract,
      # and the UI never rebuilds state from estado_conexion/ultimo_error. Static + jsdom.
      - name: Guard — ARCA Phase 1 status read model contract
        run: npm run test:arca-phase1

      # ARCA SELF-SERVICE PHASE 2A: initial setup engine. The browser never generates keys or
      # touches credential/rotation tables; the setup Edge never logs or returns key material and
      # never calls WSFE; _shared/wsaaLogin.ts stays token-identical to afip-wsaa; the 8 setup RPCs
      # stay service_role-only and scoped to setup_kind='initial'. Handler/crypto/WSAA Deno tests
      # run in `npm run test:deno`. Static + jsdom here.
      - name: Guard — ARCA Phase 2A initial setup engine contract
        run: npm run test:arca-phase2a
      - name: ARCA Self-Service Phase 2B (asistente)
        run: npm run test:arca-phase2b

      # ARCA WSASS HOMOLOGACIÓN (smoke real 2026-09-15): WSASS only accepts letters and digits as the
      # device name and stamps it into the certificate CN. prepare_initial stays the authority:
      # homologación alias is [A-Za-z0-9]{3,50}, producción keeps its previous rule, and once the
      # wizard declares per-environment patterns they must behave exactly like the server's.
      - name: Guard — ARCA WSASS homologación device name
        run: npm run test:arca-wsass-alias

      - name: Guard — SEC-08E R2B activation stays canonical
        run: npm run guard:sec08e-r2a:self-test && npm run guard:sec08e-r2b:self-test && npm run guard:sec08e-r2b

      # P0 EDGE CORS: the headers the official client sends must stay allowed by
      # every browser-called Edge Function preflight (static guard + real SDK capture).
      - name: Guard — browser Edge CORS contract
        run: npm run guard:edge-cors-contract:self-test && npm run guard:edge-cors-contract && npm run test:components -- tests/components/edgeCorsClientContract.test.ts

      # BETA-GATE-1 · LOTE D: the repository is public. The real owner's email, the production ARCA alias
      # and CUIT were removed from HEAD and must not come back (rules are SHA-256 digests, never plaintext).
      # The only exception is the archived _legacy data migration, pinned by exact path + content hash.
      # verify-removed reads the pre-sanitization commit from git (fetched by SHA; the checkout is shallow)
      # and proves the REAL rules block each removed value and its variants. Nothing is printed.
      - name: Guard — no real personal/fiscal data (BETA-GATE-1 Lote D)
        run: npm run guard:no-real-data:self-test && npm run guard:no-real-data && git fetch --no-tags --depth=1 origin c90a4edf875ac3877f33e297543ff49246a869c0 && npm run guard:no-real-data:verify-removed

      # FISCAL DATE ARGENTINA: the documents show `fecha` as the sale date (Argentina
      # civil day) and never as the fiscal issue date. CbteFch itself is covered by
      # tests/deno/fiscalCalendar.test.ts in `test:deno`.
      - name: Fiscal date — sale vs fiscal issue date on document surfaces
        run: npm run test:components -- tests/components/fiscalDateSaleLabel.test.tsx tests/components/fiscalPostReconciliacion.test.tsx

      # FINANCE BUSINESS DATE: the Finance presets (Hoy, Ayer, Semana, Este mes,
      # Mes ant.) are Argentina civil-date ranges, never UTC dates. Every vector
      # also runs under several process time zones, UTC included.
      # 2A: the date defaults that get RECORDED (expense, supplier invoice,
      # supplier purchase and payment, owner withdrawal) start on the Argentina
      # business date, checked on the real screens at night-time AR instants.
      # 2B: finance filters, reads and KPIs (expenses list and "Gastado hoy",
      # caja history "Hoy", dashboard sales windows and revenue, inventory
      # valuation snapshot, recurring "paid this month", finance service
      # periods) query Argentina business dates, checked on the real hooks.
      # 2C: Reports periods are Argentina calendar ranges [from, to): DATE
      # columns get 'YYYY-MM-DD', timestamptz columns get 00:00 AR with an
      # explicit offset; dateUtils delegates to the single business calendar.
      - name: Finance — business date (ranges, recorded defaults, reads, reports)
        run: npm run test:components -- tests/components/businessDateRange.test.ts tests/components/businessDateDefaults.test.tsx tests/components/businessDateReads.test.tsx tests/components/businessDateReports.test.tsx tests/components/businessDateUtils.test.ts

      # FISCAL DATE Part 2: the ARCA lookup runner must stay read-only. The guard
      # walks its local import graph and fails if emission, number reservation,
      # attempt completion, a DB write, service_role or any operation other than
      # `consultar` becomes reachable. Its self-test plants each violation first,
      # so a guard that stopped detecting anything fails instead of passing.
      - name: Fiscal date Part 2 — ARCA lookup runner is read-only
        run: npm run guard:fdp2-runner-readonly:self-test && npm run guard:fdp2-runner-readonly

      # G2-C.3A2: el navegador deja de ser autoridad del stock. Estatico (src/ +
      # migraciones) y de componentes: corre en PRs y forks. El self-test va
      # primero; el E2E de los flujos vive en m7-local (job e2e-local).
      - name: G2-C.3A2 — frontend stock authority (guard + component tests)
        run: npm run test:g2c3a2

      # G2-C.3A3: lockdown en base de la autoridad de stock. El guard estatico
      # (self-test primero) corre aca; la matriz SQL/PostgREST vive en el job
      # g2c3a3-inventory-lockdown, que aplica la migracion desde cero.
      - name: G2-C.3A3 — DB stock authority lockdown (static guard)
        run: npm run guard:g2c3a3-inventory-authority:self-test && npm run guard:g2c3a3-inventory-authority

      # PRE-BETA-1: public.users (legacy, GLOBAL, sin business_id) salio de la API.
      # Estatico: src/ y supabase/functions/ no la consultan (from/embeds/hints) y
      # ninguna migracion posterior la vuelve a abrir. Self-test primero. La matriz
      # SQL/PostgREST y el guard de catalogo viven en el job prebeta1-public-users.
      - name: PRE-BETA-1 — public.users fuera del cliente (guard estatico + component tests)
        run: npm run guard:tenant-isolation:static:self-test && npm run guard:tenant-isolation:static && npm run test:components -- tests/components/prebeta1PublicUsersRetired.test.tsx

      - name: Production build
        run: npm run build
        env:
          # Dummy values — build only checks bundling/TS, not runtime
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      # AFIP-S3A: prueba criptográfica en el MISMO runtime que las Edge Functions.
      # Deno resuelve npm:node-forge por su cuenta (--node-modules-dir=auto), así
      # que no toca package.json ni package-lock.json.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno crypto test (AFIP key/cert correspondence + PKCS7 signing)
        run: npm run test:deno

  sec08e-r3:
    name: SEC-08E R3 Security Matrix
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # The matrix anchors the live annulment body to immutable PR #110.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start the intentional current-main migration gap
        shell: bash
        run: |
          set -euo pipefail
          r3="supabase/migrations/20260922120000_sec08e_auxiliary_financial_reads.sql"
          sec08f="supabase/migrations/20261001120000_sec08f_remaining_read_authority.sql"
          # G2-B es una migracion CANDIDATA, igual que SEC-08F: se aparta antes
          # de levantar y NO se devuelve. R3 hace dos comprobaciones acopladas
          # (sec08e-r3-local.mjs): el ledger de la fuente debe ser exactamente
          # el contenido de supabase/migrations (linea 123) y el catalogo local
          # debe coincidir con production-discovery.json (linea 137). Aplicar el
          # candidato rompe la segunda; dejar el archivo sin aplicar romperia la
          # primera. Apartar el archivo satisface ambas sin tocar el baseline de
          # produccion ni relajar la comparacion: R3 sigue comparando el catalogo
          # COMPLETO, funcion por funcion, sin exclusiones. Su contrato es
          # certificar "current main menos los candidatos"; el contrato de G2-B
          # lo certifica el job g2b-immutability, que si lo aplica.
          # G2-C se aparta por la MISMA razon, aunque no agregue funciones
          # nuevas: reemplaza el cuerpo de dos existentes, y R3 compara la
          # `definition` completa de cada funcion contra produccion. Un cuerpo
          # distinto es drift igual que una funcion nueva. Lo certifica el job
          # g2c-stock-arithmetic.
          # G2-C.1 tambien: agrega una RPC y cambia grants/policies de las
          # tablas mayoristas, que R3 compara contra produccion. Lo certifica el
          # job g2c1-wholesale-authority.
          # G2-C.2 tambien: agrega un helper privado y reemplaza el cuerpo de
          # cuatro writers de stock. Lo certifica el job g2c2-inventory-locks.
          # G2-C.3B0 tambien: reemplaza el cuerpo de W6 (repair) y de su preview,
          # y sus precondiciones exigen G2-C.2, que aca esta apartada. Lo
          # certifica el job g2c3b0-stock-repair.
          # G2-C.3A1 tambien: agrega una RPC, su impl privado y una tabla de
          # idempotencia (drift frente al catalogo de produccion), y sus
          # precondiciones exigen G2-C.2 y G2-C.3B0, que aca estan apartadas. Lo
          # certifica el job g2c3a1-stock-adjustments.
          # G2-C.3A3 tambien: cambia grants, policies, triggers y una FK de
          # inventory / inventory_movements y agrega dos funciones privadas
          # (drift frente al catalogo de produccion), y su PRECONDICION 4 exige
          # que A1 sea la migracion previa. Lo certifica el job
          # g2c3a3-inventory-lockdown.
          # PRE-BETA-1 tambien: revoca grants y borra las policies de
          # public.users (drift frente al catalogo de produccion), y su
          # PRECONDICION 2 exige que A3 sea la migracion previa. Lo certifica el
          # job prebeta1-public-users.
          # PRE-BETA-3A-2S tambien (dos migraciones): redefine funciones de
          # features/capacidades/checkout, policies mayoristas y de Portal Clic,
          # y agrega un trigger y una tabla privada (drift frente al catalogo de
          # produccion). Lo certifica el job prebeta3a2s-server-authority.
          g2b="supabase/migrations/20261003120000_g2b_comprobante_items_immutability.sql"
          g2c="supabase/migrations/20261004120000_g2c_negative_stock_reversal.sql"
          g2c1="supabase/migrations/20261005120000_g2c1_wholesale_stock_authority.sql"
          g2c2="supabase/migrations/20261006120000_g2c2_inventory_concurrency_locks.sql"
          g2c3b0="supabase/migrations/20261007120000_g2c3b0_stock_repair_no_wholesale.sql"
          g2c3a1="supabase/migrations/20261008120000_g2c3a1_inventory_stock_adjustments.sql"
          g2c3a3="supabase/migrations/20261009120000_g2c3a3_inventory_authority_lockdown.sql"
          prebeta1="supabase/migrations/20261010120000_prebeta1_public_users_api_retirement.sql"
          p3s_mayorista="supabase/migrations/20261011120000_prebeta3a2s_wholesale_server_authority.sql"
          p3s_clic="supabase/migrations/20261011130000_prebeta3a2s_portal_clic_internal_authority.sql"
          mv "$r3" "$RUNNER_TEMP/"
          mv "$sec08f" "$RUNNER_TEMP/"
          mv "$g2b" "$RUNNER_TEMP/"
          mv "$g2c" "$RUNNER_TEMP/"
          mv "$g2c1" "$RUNNER_TEMP/"
          mv "$g2c2" "$RUNNER_TEMP/"
          mv "$g2c3b0" "$RUNNER_TEMP/"
          mv "$g2c3a1" "$RUNNER_TEMP/"
          mv "$g2c3a3" "$RUNNER_TEMP/"
          mv "$prebeta1" "$RUNNER_TEMP/"
          mv "$p3s_mayorista" "$RUNNER_TEMP/"
          mv "$p3s_clic" "$RUNNER_TEMP/"
          supabase start
          mv "$RUNNER_TEMP/$(basename "$r3")" "$r3"
      - name: Run real PostgreSQL/PostgREST R3 matrix
        run: npm run test:sec08e-r3
      - name: Tear down local Supabase
        if: always()
        run: supabase stop --no-backup || true

  sec08f:
    name: SEC-08F Security Matrix
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start current main without the SEC-08F candidate
        shell: bash
        run: |
          set -euo pipefail
          sec08f="supabase/migrations/20261001120000_sec08f_remaining_read_authority.sql"
          mv "$sec08f" "$RUNNER_TEMP/"
          trap 'mv "$RUNNER_TEMP/$(basename "$sec08f")" "$sec08f"' EXIT
          supabase start
      - name: Run real PostgreSQL/PostgREST SEC-08F matrix
        run: npm run test:sec08f
      - name: Tear down local Supabase
        if: always()
        run: supabase stop --no-backup || true

  # ── G2-B · inmutabilidad de comprobante_items ─────────────────────────────
  # SEC-08E R3 aparta este candidato porque su contrato es certificar main SIN
  # candidatos contra el catalogo de produccion. Ese aislamiento deja un hueco:
  # nadie ejecutaria la migracion G2-B en CI. Este job es la contraparte —
  # levanta una DB limpia CON G2-B aplicada y corre su matriz completa.
  g2b-immutability:
    name: G2-B Comprobante Items Immutability
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      # En un runner limpio `supabase start` aplica TODAS las migraciones desde
      # cero, G2-B incluida. Ademas es un replay fresco real: si la migracion no
      # fuera reproducible desde vacio, el job falla aca y no en los tests.
      - name: Start local Supabase with the G2-B candidate applied
        run: supabase start
      - name: Run the G2-B immutability matrix (guard self-test + guard + SQL)
        run: npm run test:g2b
      - name: Tear down local Supabase
        if: always()
        run: supabase stop --no-backup || true

  # ── G2-C · stock aritmetico (sobreventa permitida, reversa exacta) ────────
  # Misma estructura que el job de G2-B y por el mismo motivo: R3 aparta este
  # candidato, asi que su contrato necesita un job propio que SI lo aplique.
  # La migracion parchea dos funciones existentes sobre `pg_get_functiondef`,
  # asi que este replay desde cero tambien prueba que el parche encuentra su
  # patron: si no lo encontrara, aborta fail-closed y el job falla aca.
  g2c-stock-arithmetic:
    name: G2-C Negative Stock Reversal
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start local Supabase with the G2-C candidate applied
        run: supabase start
      - name: Run the G2-C stock matrix (guard self-test + guard + SQL)
        run: npm run test:g2c
      - name: Tear down local Supabase
        if: always()
        run: supabase stop --no-backup || true

  # ── G2-C.1 · autoridad del pedido mayorista ───────────────────────────────
  # Misma estructura que G2-B/G2-C: R3 aparta este candidato, asi que su
  # contrato necesita un job propio que SI lo aplique desde cero. La migracion
  # tiene precondiciones y postcondiciones fail-closed: si el replay no la
  # reproduce, `supabase start` falla aca y no en los tests.
  #   PEDIDO MAYORISTA = ESTADO COMERCIAL · COMPROBANTE = MOVIMIENTO DE STOCK.
  g2c1-wholesale-authority:
    name: G2-C.1 Wholesale Order Authority
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start local Supabase with the G2-C.1 candidate applied
        run: supabase start
      - name: Run the G2-C.1 matrix (guard self-test + guard + SQL)
        run: npm run test:g2c1
      - name: Tear down local Supabase
        if: always()
        run: supabase stop --no-backup || true

  # ── G2-C.2 · locks canonicos de inventario ────────────────────────────────
  # Misma estructura que G2-B/G2-C/G2-C.1: R3 aparta este candidato, asi que su
  # contrato necesita un job propio que lo aplique desde cero (precondiciones y
  # postcondiciones fail-closed: si el replay no lo reproduce, `supabase start`
  # falla aca). La matriz de concurrencia abre conexiones REALES en paralelo.
  #   read-modify-write de stock: lock de inventory ORDER BY id, por negocio,
  #   FOR NO KEY UPDATE en TODOS los writers (G2-C.2R).
  # G2-C.2R es obligatorio y verde: checkout [A,B] contra el alta mayorista [B,A]
  # (FK FOR KEY SHARE en orden del payload) tiene que dar cero deadlocks y ambas
  # operaciones completas, 10 de 10 (escenario WS), mas los cruces FK y la carga
  # pgbench S3.
  g2c2-inventory-locks:
    name: G2-C.2 Inventory Concurrency Locks
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start local Supabase with the G2-C.2 candidate applied
        run: supabase start
      - name: Run the G2-C.2 + G2-C.2R matrix (guard self-test + guard + SQL + real concurrency)
        env:
          G2C2_PGBENCH_CLIENTS: '8'
        run: npm run test:g2c2
      - name: Tear down local Supabase
        if: always()
        run: supabase stop --no-backup || true

  # ── G2-C.3B0 · StockRepairTool sin autoridad sobre pedidos mayoristas ─────
  # Misma estructura que G2-B/G2-C/G2-C.1/G2-C.2: R3 aparta este candidato,
  # asi que su contrato necesita un job propio que lo aplique desde cero
  # (pre y postcondiciones fail-closed: si el replay no lo reproduce,
  # `supabase start` falla aca).
  #   PEDIDO MAYORISTA = ESTADO COMERCIAL: tampoco la reparacion de stock mueve
  #   inventario por un pedido; la rama de comprobantes solo repara lo que el
  #   checkout habria descontado (producto/repuesto).
  g2c3b0-stock-repair:
    name: G2-C.3B0 Stock Repair Without Wholesale
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start local Supabase with the G2-C.3B0 candidate applied
        run: supabase start
      - name: Run the G2-C.3B0 matrix (G2-C.2 guard self-test + guard + SQL)
        run: npm run test:g2c3b0
      - name: Tear down local Supabase
        if: always()
        run: supabase stop --no-backup || true

  # ── G2-C.3A1 · autoridad atomica para ajustes de stock (aditiva) ──────────
  # Misma estructura que G2-B/G2-C/G2-C.1/G2-C.2/G2-C.3B0: R3 aparta este
  # candidato, asi que su contrato necesita un job propio que lo aplique desde
  # cero (pre y postcondiciones fail-closed: si el replay no lo reproduce,
  # `supabase start` falla aca). La matriz de concurrencia abre conexiones REALES.
  #   stock sin documento (inicial / import / manual) = UNA RPC: idempotencia
  #   server-side -> lock canonico G2-C.2 -> UPDATE -> movimiento; stale por fila
  #   si el import trae un expected viejo; negativos permitidos.
  # A1 NO cierra todavia el navegador (A2 migra el frontend, A3 revoca).
  g2c3a1-stock-adjustments:
    name: G2-C.3A1 Stock Adjustment Authority
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start local Supabase with the G2-C.3A1 candidate applied
        run: supabase start
      - name: Run the G2-C.3A1 matrix (guards + self-tests + SQL + real concurrency C1-C5)
        run: npm run test:g2c3a1
      - name: Tear down local Supabase
        if: always()
        run: supabase stop --no-backup || true

  # ── G2-C.3A3 · lockdown en base de la autoridad de stock ──────────────────
  # Misma estructura que G2-C.3A1: R3 aparta este candidato, asi que su
  # contrato necesita un job propio que lo aplique desde cero (13 precondiciones
  # y 18 postcondiciones fail-closed: si el replay no lo reproduce, `supabase
  # start` falla aca). La matriz SQL ejecuta como la API (SET LOCAL ROLE +
  # request.jwt.claim.sub) y la de PostgREST por HTTP con JWT reales:
  #   la API NO escribe stock/stock_quantity ni inventory_movements; la metadata
  #   se sigue creando (en 0) y editando; A1 y los writers documentales siguen
  #   escribiendo; el libro es append-only; un producto con historial no se
  #   borra en duro. La concurrencia real (G2-C.2 / A1) la certifican los jobs
  #   g2c2-inventory-locks y g2c3a1-stock-adjustments, que ahora corren con A3
  #   aplicada.
  g2c3a3-inventory-lockdown:
    name: G2-C.3A3 DB Stock Authority Lockdown
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      # PRECONDICION 7 (compatibilidad PostgreSQL 17): la matriz necesita la base
      # en estado A1, asi que el stack arranca con A3 apartada; despues la CLI
      # aplica A3 como en produccion (queda registrada en el ledger).
      # PRE-BETA-1 (posterior a A3) tambien se aparta: su PRECONDICION 2 exige A3
      # como ultima migracion aplicada. `migration up` aplica despues A3 y
      # PRE-BETA-1, en orden.
      # PRE-BETA-3A-2S (posterior a PRE-BETA-1) se aparta y NO se devuelve: si
      # quedara en la carpeta, `supabase start` la aplicaria sobre A1 y despues
      # `migration up` no podria insertar A3/PRE-BETA-1 antes de ella. Su
      # contrato lo certifica el job prebeta3a2s-server-authority.
      - name: Start local Supabase at A1 (G2-C.3A3 set aside)
        shell: bash
        run: |
          set -euo pipefail
          a3="supabase/migrations/20261009120000_g2c3a3_inventory_authority_lockdown.sql"
          prebeta1="supabase/migrations/20261010120000_prebeta1_public_users_api_retirement.sql"
          mv supabase/migrations/20261011120000_prebeta3a2s_wholesale_server_authority.sql "$RUNNER_TEMP/"
          mv supabase/migrations/20261011130000_prebeta3a2s_portal_clic_internal_authority.sql "$RUNNER_TEMP/"
          mv "$a3" "$RUNNER_TEMP/"
          mv "$prebeta1" "$RUNNER_TEMP/"
          trap 'mv "$RUNNER_TEMP/$(basename "$a3")" "$a3"; mv "$RUNNER_TEMP/$(basename "$prebeta1")" "$prebeta1"' EXIT
          supabase start
      - name: G2-C.3A3 PRECONDICION 7 matrix (PG17 MAINTAIN optional, any other drift aborts)
        run: npm run test:p7:g2c3a3
      - name: Apply the G2-C.3A3 candidate with the CLI (exactly one ledger row)
        shell: bash
        run: |
          set -euo pipefail
          supabase migration up --local
          n=$(docker exec supabase_db_techrepair-vite psql -U postgres -d postgres -Atc "SELECT count(*) FROM supabase_migrations.schema_migrations WHERE version IN ('20261009120000', '20261010120000')")
          test "$n" = "2"
      - name: Run the G2-C.3A3 matrix (guards + self-tests + SQL as the API + PostgREST)
        run: npm run test:g2c3a3
      - name: Tear down local Supabase
        if: always()
        run: supabase stop --no-backup || true

  # ── PRE-BETA-1 · public.users fuera de la API ─────────────────────────────
  # public.users es legacy y GLOBAL (sin business_id, con PII): authenticated la
  # leia entera (USING true) y el owner/admin de CUALQUIER negocio la escribia.
  # El stack arranca en A3 con el candidato apartado para correr ANTES los
  # controles negativos (el bypass tiene que reproducirse) y la matriz de
  # precondiciones fail-closed; despues la CLI aplica PRE-BETA-1 como en
  # produccion (una fila en el ledger) y corre el contrato post-fix: guard
  # global de tablas publicas (estatico + catalogo, self-tests primero), matriz
  # SQL como la API y PostgREST/GraphQL por HTTP con JWT reales.
  prebeta1-public-users:
    name: PRE-BETA-1 public.users Tenant Isolation
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      # PRE-BETA-3A-2S (posterior) se aparta y NO se devuelve, por la misma
      # razon que en g2c3a3: `migration up` tiene que aplicar SOLO PRE-BETA-1.
      # Lo certifica el job prebeta3a2s-server-authority.
      - name: Start local Supabase at A3 (PRE-BETA-1 set aside)
        shell: bash
        run: |
          set -euo pipefail
          prebeta1="supabase/migrations/20261010120000_prebeta1_public_users_api_retirement.sql"
          mv supabase/migrations/20261011120000_prebeta3a2s_wholesale_server_authority.sql "$RUNNER_TEMP/"
          mv supabase/migrations/20261011130000_prebeta3a2s_portal_clic_internal_authority.sql "$RUNNER_TEMP/"
          mv "$prebeta1" "$RUNNER_TEMP/"
          trap 'mv "$RUNNER_TEMP/$(basename "$prebeta1")" "$prebeta1"' EXIT
          supabase start
      - name: BEFORE — negative controls (bypass reproduced) + precondition matrix
        run: npm run test:prebeta1:before
      - name: Apply the PRE-BETA-1 candidate with the CLI (exactly one ledger row)
        shell: bash
        run: |
          set -euo pipefail
          supabase migration up --local
          n=$(docker exec supabase_db_techrepair-vite psql -U postgres -d postgres -Atc "SELECT count(*) FROM supabase_migrations.schema_migrations WHERE version = '20261010120000'")
          test "$n" = "1"
      - name: AFTER — tenant isolation guard + SQL as the API + PostgREST/GraphQL
        run: npm run test:prebeta1
      - name: Tear down local Supabase
        if: always()
        run: supabase stop --no-backup || true

  # ── PRE-BETA-3A-2S · autoridad server-side de Mayorista + Portal Clic ─────
  # Mismo patron BEFORE/AFTER que PRE-BETA-1: el stack arranca en PRE-BETA-1 con
  # las dos migraciones 3A-2S apartadas; el preflight de solo lectura tiene que
  # dar todos los gates en true; despues la CLI aplica las dos como en
  # produccion (dos filas en el ledger) y corre el contrato: guard + self-test,
  # guard read-only de los SQL operativos, vitest, matriz SQL como la API
  # (Mayorista y Portal Clic), verificacion post-deploy y smoke con ROLLBACK.
  # El binding de Portal Clic (docs/prebeta3a2s/portal-clic-binding.sql) NO se
  # ejecuta: es un paso manual de un operador.
  prebeta3a2s-server-authority:
    name: PRE-BETA-3A-2S Wholesale + Portal Clic Server Authority
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start local Supabase at PRE-BETA-1 (3A-2S set aside)
        shell: bash
        run: |
          set -euo pipefail
          mayorista="supabase/migrations/20261011120000_prebeta3a2s_wholesale_server_authority.sql"
          clic="supabase/migrations/20261011130000_prebeta3a2s_portal_clic_internal_authority.sql"
          mv "$mayorista" "$RUNNER_TEMP/"
          mv "$clic" "$RUNNER_TEMP/"
          trap 'mv "$RUNNER_TEMP/$(basename "$mayorista")" "$mayorista"; mv "$RUNNER_TEMP/$(basename "$clic")" "$clic"' EXIT
          supabase start
      - name: BEFORE — read-only preflight (every gate true)
        run: npm run test:preflight:prebeta3a2s
      - name: Apply the 3A-2S candidates with the CLI (exactly two ledger rows)
        shell: bash
        run: |
          set -euo pipefail
          supabase migration up --local
          n=$(docker exec supabase_db_techrepair-vite psql -U postgres -d postgres -Atc "SELECT count(*) FROM supabase_migrations.schema_migrations WHERE version IN ('20261011120000', '20261011130000')")
          test "$n" = "2"
      - name: AFTER — guards + vitest + SQL as the API + post-deploy verify + smoke (rollback)
        run: npm run test:prebeta3a2s
      - name: Tear down local Supabase
        if: always()
        run: supabase stop --no-backup || true

  # ── E2E contra un Supabase LOCAL y descartable ────────────────────────────
  # Antes este job recibía `secrets.VITE_SUPABASE_URL` y abortaba en el guard de
  # M7 7D.2 antes del primer test ("E2E ABORTADO: el destino Supabase no es local
  # y seguro"): 0 tests ejecutados. El guard estaba bien; faltaba el ENTORNO.
  #
  # Ahora el job levanta su propio stack con la CLI y toma URL y claves de
  # `supabase status`. Consecuencia: NO usa un solo secret del repo, así que
  # puede correr también en pull_request —incluidos forks, que no tienen acceso
  # a secrets— y dar señal ANTES del merge en vez de después.
  e2e-local:
    # El `name:` visible se conserva EXACTAMENTE como estaba ("E2E Smoke Tests").
    # Es la cadena con la que GitHub resuelve un required status check, así que
    # cambiarla rompería cualquier branch protection que lo exija. Hoy `main` no
    # tiene protección ni rulesets (verificado por API), así que no rompe nada
    # ahora mismo; se mantiene igual porque el rename no aporta nada y sí
    # convierte "activar protección" en un paso con trampa.
    # El nombre quedó heredado: hoy este job gatea `m7-local`, no `@smoke`.
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: quality
    if: vars.E2E_ENABLED != 'false'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Node 22 SÓLO acá: `scripts/e2e/*.mjs` y el guard de abajo importan
      # `assertLocalTarget.ts` para no duplicar el guard de destino, y eso
      # necesita el type stripping nativo (sin flag desde 22.18). En Node 20
      # mueren con ERR_UNKNOWN_FILE_EXTENSION antes de llegar a los tests.
      # (`quality` tambien corre en 22: PRE-BETA-3A-2 usa `node --test` sobre .ts.)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Primero de todo: es estático, tarda segundos y falla ANTES de gastar
      # minutos instalando browsers y levantando Docker. Vive en este job —y no
      # en `quality`— porque importa `assertLocalTarget.ts` y necesita Node 22.
      - name: Guard — E2E CI is local-only
        run: npm run guard:ci-e2e:self-test && npm run guard:ci-e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Versión fija: un stack local reproducible es todo el punto de este job.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # Bootstrap + suite en un solo script, el MISMO que se corre en local
      # (`npm run e2e:ci-local`). Levanta el stack, valida que el destino sea
      # local con `motivoDeRechazo` (la misma autoridad que el globalSetup),
      # genera `.env.e2e` desde `supabase status`, aplica el marker y los datos,
      # y recién ahí corre Playwright.
      #
      # En un runner limpio `supabase start` aplica las migraciones desde cero,
      # así que el esquema arranca en estado reproducible sin un reset extra.
      #
      # Se gatea sobre `m7-local` —46 tests: idempotencia transaccional, códigos
      # de error reales, aislamiento multi-tenant por RLS y los gates visuales—
      # y NO sobre las suites legacy `@smoke`. Motivo medido en este mismo lote,
      # con el entorno ya funcionando: `@smoke` ejecuta 250 de 289 tests en
      # 9,6 min y falla 24. Ninguna de esas 24 fallas es por falta de entorno
      # (son aserciones de "cero errores de consola" y fixtures que el seed E2E
      # no siembra: garantías, cuentas de Mi Guita). Es deuda real y acotada,
      # pero arreglarla es producto — otro lote. Gatear sobre ella hoy dejaría
      # el CI rojo de forma permanente, que es de donde venimos.
      # ARCA Self-Service Phase 2B: `e2e:ci-local` levanta el Edge local del asistente ARCA
      # (handler real de arca-selfservice-setup sobre Deno, WSAA simulado). Sin Deno aborta.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run E2E against local Supabase
        run: npm run e2e:ci-local -- --project=m7-local
        env:
          CI: 'true'

      - name: Upload Playwright report (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      # Incondicional: si la suite falla, los contenedores igual tienen que
      # irse. `--no-backup` descarta los volúmenes — el stack es desechable.
      - name: Tear down local Supabase
        if: always()
        run: supabase stop --no-backup || true
