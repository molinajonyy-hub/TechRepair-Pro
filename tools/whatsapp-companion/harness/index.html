<!doctype html>
<meta charset="utf-8">
<title>Companion · harness</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
  button { margin: 6px 8px 6px 0; padding: 12px 18px; border: 0; border-radius: 8px;
           background: #25d366; color: #fff; font: inherit; cursor: pointer; }
  button.mal { background: #b91c1c; }
  input { width: 340px; padding: 8px; font: inherit; }
  pre { background: #f4f4f5; padding: 12px; border-radius: 8px; white-space: pre-wrap; min-height: 90px; }
  .nota { background: #fffbe6; border: 1px solid #f0d98c; padding: 12px 14px; border-radius: 8px; }
</style>

<h1>TechRepair WhatsApp Companion — harness</h1>

<div class="nota">
  Esta página tiene que servirse desde un origin listado en
  <code>externally_connectable</code> del manifest. Si probás en local, agregá tu origin
  de dev ahí y recargá la extensión.
</div>

<p>
  <label>EXTENSION_ID:
    <input id="eid" placeholder="pegá el ID de chrome://extensions">
  </label>
</p>

<h2>Handoffs</h2>
<button data-phone="5493511234567" data-text="Hola, soy TechRepair. Mensaje para el cliente A.">Cliente A</button>
<button data-phone="5491123456789" data-text="Hola, soy TechRepair. Mensaje para el cliente B.">Cliente B</button>
<button data-phone="5493512223333" data-text="Hola, soy TechRepair. Mensaje para el cliente C.">Cliente C</button>

<h2>Negativos de seguridad</h2>
<button class="mal" data-caso="phone">phone inválido</button>
<button class="mal" data-caso="tipo">type desconocido</button>
<button class="mal" data-caso="url">payload con url arbitraria</button>
<button class="mal" data-caso="largo">text gigante</button>

<h2>Resultado</h2>
<pre id="out">—</pre>

<script>
  const out = document.getElementById('out')
  const eid = document.getElementById('eid')
  eid.value = localStorage.getItem('companion_eid') ?? ''
  eid.addEventListener('change', () => localStorage.setItem('companion_eid', eid.value.trim()))

  function enviar(payload) {
    const id = eid.value.trim()
    if (!id) { out.textContent = 'Falta el EXTENSION_ID.'; return }
    if (!chrome?.runtime?.sendMessage) { out.textContent = 'chrome.runtime no disponible en este contexto.'; return }
    const t0 = performance.now()
    chrome.runtime.sendMessage(id, payload, (res) => {
      const err = chrome.runtime.lastError
      out.textContent = JSON.stringify({
        enviado: payload,
        respuesta: res ?? null,
        lastError: err ? err.message : null,
        ms: Math.round(performance.now() - t0),
      }, null, 2)
    })
  }

  for (const b of document.querySelectorAll('button[data-phone]')) {
    b.onclick = () => enviar({ type: 'OPEN_WHATSAPP_WEB', phone: b.dataset.phone, text: b.dataset.text })
  }

  const negativos = {
    phone: { type: 'OPEN_WHATSAPP_WEB', phone: '+54 9 351 boom', text: 'hola' },
    tipo:  { type: 'DAME_LOS_CHATS', phone: '5493511234567', text: 'hola' },
    url:   { type: 'OPEN_WHATSAPP_WEB', phone: '5493511234567', text: 'hola', url: 'https://evil.example/x' },
    largo: { type: 'OPEN_WHATSAPP_WEB', phone: '5493511234567', text: 'x'.repeat(9000) },
  }
  for (const b of document.querySelectorAll('button[data-caso]')) {
    b.onclick = () => enviar(negativos[b.dataset.caso])
  }
</script>
